<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B2FCF">
  <title>Class Routine</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script>
    /* Apply saved / system theme before paint to avoid a flash */
    (function () {
      var theme = 'light';
      try { theme = localStorage.getItem('routine-theme') || ''; } catch (e) {}
      if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <header class="top">
    <div class="wrap">
      <div class="top__bar">
        <div>
          <h1>Class Routine</h1>
          <p id="todayLabel" class="top__date"></p>
        </div>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch light or dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>

      <section id="nowCard" class="now" aria-live="polite"></section>
    </div>
  </header>

  <nav class="tabs" aria-label="Choose a day">
    <div id="tabs" class="tabs__in" role="tablist"></div>
  </nav>

  <main class="wrap">
    <section id="dayView" aria-live="polite">
      <div id="dayHead" class="day-head"></div>
      <ol id="timeline" class="timeline"></ol>
    </section>

    <section id="weekView" hidden>
      <div class="day-head">
        <div>
          <h2>Full week</h2>
          <p>Saturday to Wednesday at a glance</p>
        </div>
      </div>
      <div class="table-wrap">
        <table id="weekTable"></table>
      </div>
      <p class="hint">Scroll sideways to see every period.</p>
    </section>
  </main>

  <footer class="foot">
    <p>Swipe left or right to change the day.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
